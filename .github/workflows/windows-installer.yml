name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop/**"
      - "samples/**"
      - ".github/workflows/windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"          # read/write files as UTF-8 on Windows, like everywhere else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the user interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]" pyinstaller

      - name: Install Tesseract OCR (bundled into the app for scanned PDFs)
        run: choco install tesseract -y --no-progress

      - name: Run the test suite on Windows
        working-directory: backend
        env:
          TESSERACT_CMD: C:\Program Files\Tesseract-OCR\tesseract.exe
        run: python -m pytest -q

      - name: Build the desktop app
        env:
          TESSERACT_DIR: C:\Program Files\Tesseract-OCR
        run: pyinstaller desktop/screenplay_breakdown.spec --noconfirm

      - name: Self-test the built app
        # It is a windowed app (no console), so wait for it and read its result file.
        run: |
          $p = Start-Process -FilePath "dist\ScreenplayBreakdown\ScreenplayBreakdown.exe" -ArgumentList "--smoke","--smoke-out=$env:RUNNER_TEMP\smoke.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\smoke.txt"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build the installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop\installer.iss

      - name: Portable zip (no install needed)
        run: Compress-Archive -Path dist\ScreenplayBreakdown -DestinationPath desktop\Output\ScreenplayBreakdown-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenplayBreakdown-Windows
          path: desktop/Output/*
          retention-days: 30

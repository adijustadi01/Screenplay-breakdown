[project]
name = "screenplay-breakdown"
version = "0.1.0"
description = "Screenplay production breakdown: extraction, review and reporting engine"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    # import
    "pymupdf>=1.24",        # PDF text + geometry (for 1/8-page lengths)
    "python-docx>=1.1",
    "lxml>=5.2",            # Final Draft .fdx
    "pytesseract>=0.3.10",  # OCR fallback (needs the tesseract binary)
    # extraction
    "anthropic>=0.40",
    # export
    "openpyxl>=3.1",
    "reportlab>=4.0",       # PDF export
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.lexicon" = ["nouns.tsv.gz", "WORDNET_LICENSE.txt"]
"app.extraction" = ["prompts/*.md"]
"app.departments" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
